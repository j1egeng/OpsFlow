name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: opsflow
          POSTGRES_USER: opsflow
          POSTGRES_PASSWORD: opsflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsflow -d opsflow"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OPSFLOW_POSTGRES_TESTS: "true"
      DB_URL: jdbc:postgresql://localhost:5432/opsflow
      DB_USERNAME: opsflow
      DB_PASSWORD: opsflow
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw   # safe to remove once PR 1 is merged
      - run: ./mvnw -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build