spring:
  application:
    name: opsflow-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opsflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    clean-disabled: true
    baseline-on-migrate: false
    validate-migration-naming: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  version: "@project.version@"
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    bcrypt-strength: 12
    jwt:
      issuer: opsflow-backend
      audience: opsflow-api
      ttl: ${JWT_TTL:1h}
      secret-base64: ${JWT_SECRET_BASE64:}
      require-persistent-key: ${JWT_REQUIRE_PERSISTENT_KEY:false}
    login:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      lockout: ${LOGIN_LOCKOUT:15m}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:Administrator}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
