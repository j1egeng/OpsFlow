name: opsflow

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: opsflow
      POSTGRES_USER: opsflow
      POSTGRES_PASSWORD: ${OPSFLOW_DB_PASSWORD:?Initialize .env.docker before starting}
    volumes:
      # PostgreSQL 18 stores data below /var/lib/postgresql/18/docker.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsflow -d opsflow"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  backend:
    build:
      context: ./backend
    image: opsflow-backend:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/opsflow
      DB_USERNAME: opsflow
      DB_PASSWORD: ${OPSFLOW_DB_PASSWORD:?Initialize .env.docker before starting}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Initialize .env.docker before starting}
      JWT_REQUIRE_PERSISTENT_KEY: "true"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${OPSFLOW_HTTP_PORT:-8088},http://localhost:${OPSFLOW_HTTP_PORT:-8088}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-dockeradmin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set the container administrator email}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set the container administrator password}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    image: opsflow-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OPSFLOW_HTTP_PORT:-8088}:80"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
